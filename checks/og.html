<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Space Mono";font-weight:700;src:url("../assets/fonts/space-mono-700.woff") format("woff")}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;background:#E7E6E3;color:#1A2BE0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:56px 60px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-family:"Space Mono";font-weight:700;font-size:82px;line-height:.98;letter-spacing:-.045em}
.caps{font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.muted{color:#62657E}
.roles{margin-top:18px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-self:end}
.t{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#1A2BE0}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t .s{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:"Space Mono";font-weight:700;color:#E7E6E3;font-size:24px;line-height:.95;text-transform:uppercase;background:rgba(8,10,40,.3)}
.t .slate{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:"Space Mono";font-weight:700;color:#E7E6E3;font-size:28px;line-height:1;letter-spacing:-.03em}
.foot{display:flex;justify-content:space-between;margin-top:22px}
</style></head><body>
<div class="top"><div><h1>Pierre-Sebastien<br>Cabrejo-Jones</h1><div class="caps muted roles">Director, Videographer, Editor</div></div><div class="caps muted">London</div></div>
<div></div>
<div>
<div class="strip">
 <div class="t"><img src="../assets/poster-engages-tall.jpg"><span class="s">Coming<br>soon</span></div>
 <div class="t"><img src="../assets/poster-velvet-tall.jpg"></div>
 <div class="t"><img src="../assets/poster-figma-tall.jpg"></div>
 <div class="t"><span class="slate">Demo Reel<br>2026</span></div>
 <div class="t"><img src="../assets/poster-birthday-tall.jpg"></div>
</div>
</div>
</body></html>
